<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCE5D8" />
      <stop offset="100%" stop-color="#B8CBB2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Rounded Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#383838" stroke-width="4" opacity="0.6" />

  <!-- Inner Soft Container -->
  <rect x="48" y="48" width="416" height="416" rx="84" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="2" />

  <!-- Monogram & Emblem: Editorial Serif "P" + Bank Pillar / Laurel -->
  <g transform="translate(256, 245)">
    <!-- Graduation / Academic Crest Cap -->
    <path d="M 0 -130 L 105 -85 L 0 -40 L -105 -85 Z" fill="url(#goldGrad)" />
    <path d="M 0 -40 L 95 -80 L 95 -68 L 0 -28 L -95 -68 L -95 -80 Z" fill="#A16207" opacity="0.7" />
    <!-- Tassel -->
    <path d="M 75 -75 Q 95 -50 90 -20" stroke="#FDE047" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="90" cy="-15" r="7" fill="#FDE047" />

    <!-- Stylized "P" Serif Character -->
    <path d="M -55 -15 L 15 -15 C 60 -15 85 10 85 45 C 85 80 58 105 15 105 L -18 105 L -18 145 L -55 145 Z M -18 20 L 12 20 C 35 20 48 30 48 45 C 48 60 35 70 12 70 L -18 70 Z" fill="url(#sageGrad)" />

    <!-- Underline / Pedestal Base (Stability / Banking) -->
    <rect x="-85" y="160" width="170" height="12" rx="6" fill="url(#goldGrad)" />
    <rect x="-105" y="178" width="210" height="8" rx="4" fill="#DCE5D8" opacity="0.8" />
  </g>

  <!-- Editorial Subtext Pill -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#E2E8F0" letter-spacing="4" text-anchor="middle">PARIKSHA</text>
</svg>
